<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoho Voice Calculator — Wolq</title>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700;800&family=Wix+Madefor+Text:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09091a;--bg2:#0e0e24;--card:#12122a;--card2:#191935;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --white:#ffffff;--muted:rgba(255,255,255,0.45);--muted2:rgba(255,255,255,0.2);
  --blue:#226DB4;--blue-l:rgba(34,109,180,0.14);--blue-b:rgba(34,109,180,0.28);
  --green:#089949;--green-l:rgba(8,153,73,0.12);--green-b:rgba(8,153,73,0.28);
  --red:#E42527;--red-l:rgba(228,37,39,0.12);
  --yellow:#F9B21D;--yellow-l:rgba(249,178,29,0.12);--yellow-b:rgba(249,178,29,0.3);
  --r:12px;--r2:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Wix Madefor Text',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;line-height:1.65;font-size:17px;}

/* HEADER */
header{padding:18px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:var(--bg);gap:12px;}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.lmark{width:34px;height:34px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;}
.lmark svg{width:18px;height:18px;}
.lname{font-size:17px;font-weight:800;letter-spacing:-0.3px;}
.lname span{color:var(--blue);}
.header-right{display:flex;align-items:center;gap:10px;}
.hpill{font-size:12px;font-weight:600;color:var(--muted);background:var(--card2);border:1px solid var(--border);padding:5px 14px;border-radius:100px;}
/* LANG TOGGLE */
.lang-toggle{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:100px;padding:3px;gap:2px;}
.ltog{padding:5px 13px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);border:none;background:none;font-family:'Wix Madefor Display',sans-serif;transition:all .18s;letter-spacing:.3px;}
.ltog.on{background:var(--blue);color:#fff;}

/* MAIN */
main{max-width:1100px;margin:0 auto;padding:40px 32px 80px;}

/* PROGRESS */
.prog-wrap{margin-bottom:38px;}
.prog-track{height:3px;background:var(--border2);border-radius:3px;margin-bottom:10px;overflow:hidden;}
.prog-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .4s ease;}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500;}
.prog-meta b{color:var(--blue);}

/* STEP */
.step{display:none;animation:up .3s ease both;}
.step.active{display:block;}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.eline{width:20px;height:2px;background:var(--blue);border-radius:2px;}
.sh{font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.2;margin-bottom:10px;}
.sp{font-size:17px;color:var(--muted);margin-bottom:26px;line-height:1.65;max-width:760px;}

/* STEPPER */
.sc{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:20px 22px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:16px;}
.sc-lbl{font-size:17px;font-weight:700;}
.sc-sub{font-size:14px;color:var(--muted);margin-top:3px;}
.sc-ctrl{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.scb{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border2);background:var(--card2);color:var(--white);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;}
.scb:hover{border-color:var(--blue);color:var(--blue);}
.scn{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--blue);min-width:36px;text-align:center;}

/* LIC PREVIEW */
.lic-preview{background:var(--card2);border:1.5px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;}
.lp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px;}
.lp-plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.lp-plan{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r2);padding:12px 14px;}
.lp-plan.highlight{border-color:var(--blue);}
.lp-plan-name{font-size:12px;font-weight:700;margin-bottom:6px;color:var(--muted);}
.lp-plan.highlight .lp-plan-name{color:var(--blue);}
.lp-row{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;padding:2px 0;}
.lp-row b{color:var(--white);font-weight:600;}
.lp-row.driver{color:var(--yellow);}
.lp-row.driver b{color:var(--yellow);}
.lp-row.bonus b{color:var(--green);}
.lp-row.waste b{color:rgba(255,255,255,.3);}

/* SLIDER */
.slider-block{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:22px 22px 18px;margin-bottom:14px;}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;}
.sl-label{font-size:16px;font-weight:700;}
.sl-val{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:var(--blue);}
.sl-val span{font-size:13px;color:var(--muted);font-family:'Wix Madefor Display',sans-serif;margin-left:4px;}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:var(--border2);outline:none;cursor:pointer;margin-bottom:14px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(34,109,180,.25);cursor:pointer;transition:transform .15s;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;}
.fbr-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;}
.fbr-rows{display:flex;flex-direction:column;gap:7px;}
.fbr-row{display:flex;align-items:center;gap:10px;}
.fbr-name{font-size:12px;font-weight:600;min-width:105px;color:var(--muted);}
.fbr-track{flex:1;height:7px;border-radius:4px;background:var(--border2);overflow:visible;position:relative;}
.fbr-free{height:100%;background:var(--green);border-radius:4px;max-width:100%;position:absolute;left:0;top:0;transition:width .3s;}
.fbr-over{height:100%;background:var(--yellow);border-radius:0 4px 4px 0;position:absolute;top:0;transition:all .3s;}
.fbr-info{font-family:'DM Mono',monospace;font-size:11px;min-width:110px;text-align:right;}
.fbr-info.ok{color:var(--green);}
.fbr-info.ov{color:var(--yellow);}

/* OPTS */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:26px;}
.opt{padding:18px 16px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--card);cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:10px;}
.opt:hover{border-color:var(--border2);background:var(--card2);transform:translateY(-1px);}
.opt.sel{border-color:var(--blue);background:var(--blue-l);}
.opt-icon{width:36px;height:36px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;}
.opt.sel .opt-icon{background:var(--blue-b);}
.opt-icon svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.opt.sel .opt-icon svg{stroke:var(--blue);}
.opt-lbl{font-size:16px;font-weight:700;line-height:1.2;}
.opt.sel .opt-lbl{color:var(--blue);}
.opt-sub{font-size:14px;color:var(--muted);line-height:1.4;}

/* CHECKS */
.checks{display:flex;flex-direction:column;gap:9px;margin-bottom:26px;}
.chk{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--card);cursor:pointer;transition:all .18s;}
.chk:hover{border-color:var(--border2);}
.chk.on{border-color:var(--blue);background:var(--blue-l);}
.chk-box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);background:var(--card2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.chk.on .chk-box{background:var(--blue);border-color:var(--blue);}
.chk.on .chk-box svg{display:block;}
.chk-box svg{display:none;width:11px;height:11px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.chk-body strong{font-size:16px;font-weight:700;display:block;margin-bottom:4px;}
.chk.on .chk-body strong{color:var(--blue);}
.chk-body span{font-size:15px;color:var(--muted);line-height:1.5;}

/* NUMBERS */
.num-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:26px;}
.num-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:18px;}
.nc-icon{width:32px;height:32px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.nc-icon svg{width:16px;height:16px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.num-card label{font-size:15px;font-weight:700;display:block;margin-bottom:2px;}
.num-card .nsub{font-size:13px;color:var(--muted);display:block;margin-bottom:12px;line-height:1.4;}
.nstep{display:flex;align-items:center;gap:8px;}
.nstep button{width:32px;height:32px;border-radius:7px;border:1.5px solid var(--border2);background:var(--card2);color:var(--white);font-size:16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.nstep button:hover{border-color:var(--blue);color:var(--blue);}
.nstep input{width:48px;height:32px;background:var(--bg2);border:1.5px solid var(--border);border-radius:6px;color:var(--white);text-align:center;font-size:15px;font-weight:700;font-family:'DM Mono',monospace;outline:none;}

/* BILLING */
.btoggle{display:flex;background:var(--card);border:1.5px solid var(--border);border-radius:100px;padding:4px;width:fit-content;margin-bottom:22px;}
.btog{padding:9px 26px;border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);border:none;background:none;transition:all .2s;font-family:'Wix Madefor Display',sans-serif;}
.btog.on{background:var(--blue);color:#fff;}

/* INFO BOX */
.ib{background:var(--card2);border:1.5px solid var(--border);border-radius:var(--r2);padding:14px 18px;font-size:16px;color:var(--muted);line-height:1.55;margin-bottom:22px;display:flex;gap:10px;align-items:flex-start;}
.ib svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ib strong{color:var(--white);}
.ib.blue{border-color:var(--blue-b);background:var(--blue-l);color:rgba(255,255,255,.75);}
.ib.blue svg{stroke:var(--blue);}
.ib.green{border-color:var(--green-b);background:var(--green-l);color:rgba(255,255,255,.75);}
.ib.green svg{stroke:var(--green);}
.ib.yellow{border-color:var(--yellow-b);background:var(--yellow-l);color:rgba(255,255,255,.75);}
.ib.yellow svg{stroke:var(--yellow);}

/* NAV */
.nav{display:flex;gap:10px;align-items:center;margin-top:6px;}
.btn-next{padding:13px 32px;border-radius:100px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:'Wix Madefor Display',sans-serif;transition:all .18s;}
.btn-next:hover{opacity:.88;transform:translateY(-1px);}
.btn-next.grn{background:var(--green);}
.btn-back{padding:13px 20px;border-radius:100px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;border:1.5px solid var(--border2);cursor:pointer;font-family:'Wix Madefor Display',sans-serif;transition:all .18s;}
.btn-back:hover{color:var(--white);}

/* ═══ RESULT ═══ */
#result{display:none;}
#result.show{display:block;animation:up .4s ease both;}
.r-hero{text-align:center;padding:4px 0 28px;}
.r-hero h2{font-size:clamp(26px,4vw,36px);font-weight:900;margin-bottom:10px;}
.r-hero p{font-size:16px;color:var(--muted);}
.rec{border:1.5px solid var(--green);border-radius:var(--r);background:linear-gradient(140deg,rgba(8,153,73,.1),rgba(18,18,42,.8));padding:26px 28px;margin-bottom:18px;position:relative;overflow:hidden;}
.rec::after{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(8,153,73,.18) 0%,transparent 70%);}
.rec-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--green);background:var(--green-l);border:1px solid var(--green-b);padding:4px 12px;border-radius:100px;margin-bottom:14px;}
.rec-badge svg{width:12px;height:12px;stroke:var(--green);fill:none;stroke-width:2.5;}
.rec-name{font-size:30px;font-weight:900;margin-bottom:6px;}
.rec-why{font-size:15px;color:rgba(255,255,255,.65);margin-bottom:20px;line-height:1.6;max-width:560px;}
.rec-price-row{display:flex;align-items:baseline;gap:7px;margin-bottom:4px;}
.rec-price{font-family:'DM Mono',monospace;font-size:40px;font-weight:500;color:var(--green);line-height:1;}
.rec-psub{font-size:13px;color:var(--muted);}
.rec-total{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:20px;}
.rec-rows{display:flex;flex-direction:column;gap:7px;border-top:1px solid rgba(255,255,255,.08);padding-top:16px;}
.rr{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;color:rgba(255,255,255,.6);}
.rr .rv{font-weight:600;color:var(--white);font-size:15px;}
.rr.incl .rv{color:var(--green);font-size:12px;}
.rr.warn .rv{color:var(--red);}
.rr.dim .rv{color:rgba(255,255,255,.25);}
/* LIC BLOCK */
.lic-block{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;}
.lb-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.lb-title svg{width:14px;height:14px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.lb-stat{background:var(--card2);border-radius:var(--r2);padding:12px 14px;}
.lb-stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:4px;}
.lb-stat-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--white);line-height:1;}
.lb-stat-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.lb-stat-sub.grn{color:var(--green);}
.lb-stat-sub.yel{color:var(--yellow);}
.slots-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;}
.slots-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.slot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.slot.admin-used{background:var(--blue);color:#fff;}
.slot.admin-bonus{background:var(--green);color:#fff;}
.slot.agent-used{background:rgba(34,109,180,.35);border:1.5px solid var(--blue);color:var(--blue);}
.slot.agent-free{background:var(--border);color:rgba(255,255,255,.2);}
.slot-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;}
.sl-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.sl-dot{width:10px;height:10px;border-radius:3px;}
/* MINUTES */
.min-block{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;}
.mb-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.mb-title svg{width:14px;height:14px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.mb-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.mb-col-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.mb-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;}
.mb-row .mv{font-weight:600;}
.mb-row.free .mv{color:var(--green);}
.mb-row.over .mv{color:var(--yellow);}
.mb-row.cost .mv{color:var(--yellow);}
/* PLAN CARDS */
.cmp-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:14px;margin-top:26px;}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
.pc{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:20px 16px;position:relative;}
.pc.win{border-color:var(--green);background:linear-gradient(160deg,rgba(8,153,73,.1),var(--card));}
.pc-badge{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:9px;font-weight:700;padding:3px 12px;border-radius:0 0 7px 7px;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;}
.pc-name{font-size:15px;font-weight:800;margin-bottom:3px;}
.pc.win .pc-name{color:var(--green);}
.pc-lics{font-size:11px;color:var(--muted);margin-bottom:2px;}
.pc-price{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;line-height:1.1;}
.pc-sub{font-size:10.5px;color:var(--muted);margin-bottom:3px;}
.pc-call{font-size:12px;font-weight:600;margin-bottom:12px;}
.pc-feats{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--border);padding-top:12px;}
.pf{font-size:11.5px;display:flex;gap:6px;align-items:flex-start;line-height:1.35;}
.pf svg{width:12px;height:12px;flex-shrink:0;margin-top:1px;}
.pf.yes svg{stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.pf.no svg{stroke:var(--red);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.pf.add svg{stroke:var(--yellow);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.pf.yes{color:rgba(255,255,255,.75);}
.pf.no{color:rgba(255,255,255,.38);}
.pf.add{color:rgba(249,178,29,.85);}
/* CTA / FORM */
.cta{background:var(--card2);border:1.5px solid var(--border);border-radius:var(--r);padding:32px 36px;}
.cta h3{font-size:24px;font-weight:800;margin-bottom:8px;}
.cta p{font-size:16px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.cta-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btnc{padding:12px 24px;border-radius:100px;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:'Wix Madefor Display',sans-serif;text-decoration:none;display:inline-block;transition:all .18s;}
.btnc.pri{background:var(--blue);color:#fff;}
.btnc.pri:hover{opacity:.88;transform:translateY(-1px);}
.btnc.sec{background:transparent;color:var(--muted);border:1.5px solid var(--border2);}
.btnc.sec:hover{color:var(--white);border-color:var(--white);}
/* ZOHO FORM */
.zf-form{display:flex;flex-direction:column;gap:14px;margin-top:4px;}
.zf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.zf-form label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:block;margin-bottom:6px;}
.zf-form input[type=text],
.zf-form textarea{width:100%;background:var(--bg2);border:1.5px solid var(--border2);border-radius:8px;color:var(--white);font-size:15px;font-family:'Wix Madefor Text',sans-serif;padding:11px 14px;outline:none;transition:border-color .15s;box-sizing:border-box;}
.zf-form input[type=text]:focus,
.zf-form textarea:focus{border-color:var(--blue);}
.zf-form textarea{min-height:100px;resize:vertical;}
.zf-submit{width:100%;padding:14px;border-radius:100px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:'Wix Madefor Display',sans-serif;transition:all .18s;margin-top:4px;}
.zf-submit:hover{opacity:.88;transform:translateY(-1px);}
.zf-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.zf-success{display:none;background:var(--green-l);border:1.5px solid var(--green-b);border-radius:var(--r2);padding:18px 20px;color:var(--white);font-size:15px;text-align:center;line-height:1.6;}
.zf-success strong{display:block;font-size:17px;margin-bottom:4px;}
.zf-divider{display:flex;align-items:center;gap:12px;margin:6px 0;}
.zf-divider span{font-size:11px;color:var(--muted);white-space:nowrap;}
.zf-divider::before,.zf-divider::after{content:'';flex:1;height:1px;background:var(--border);}
@media(max-width:580px){.zf-row{grid-template-columns:1fr;}}
.btn-restart{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer;margin-top:14px;background:none;border:none;font-family:'Wix Madefor Display',sans-serif;transition:color .15s;width:100%;}
.btn-restart:hover{color:var(--white);}
.btn-restart svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.info-toggle{
  display:inline-flex;align-items:center;gap:7px;
  font-size:15px;font-weight:600;color:var(--blue);
  background:var(--blue-l);border:1px solid var(--blue-b);
  border-radius:100px;padding:6px 14px;cursor:pointer;
  font-family:'Wix Madefor Display',sans-serif;transition:all .18s;
  margin-bottom:14px;
}
.info-toggle:hover{background:var(--blue-b);}
.info-toggle svg{width:13px;height:13px;flex-shrink:0;}
.countries-box{
  background:var(--card2);border:1.5px solid var(--border);
  border-radius:var(--r2);padding:14px 18px;
  font-size:15px;color:var(--muted);line-height:1.7;
  margin-bottom:14px;
}
.disclaimer{font-size:11px;color:var(--muted2);margin-top:26px;line-height:1.65;border-top:1px solid var(--border);padding-top:18px;}

@media(max-width:580px){
  .plan-grid,.lb-grid,.mb-grid,.lp-plans{grid-template-columns:1fr;}
  .opts{grid-template-columns:1fr 1fr;}
  header{padding:14px 16px;}
  main{padding:28px 16px 60px;}
  .hpill{display:none;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://www.wolq.nl/Logos/wolq-without-cloud-logo-white.png" alt="Wolq" style="height:48px;width:auto;">
  </div>
  <div class="header-right">
    <div class="hpill" data-i18n="header_pill">Zoho Voice Calculator</div>
    <div class="lang-toggle">
      <button class="ltog on" id="lt-nl" onclick="setLang('nl')">NL</button>
      <button class="ltog" id="lt-en" onclick="setLang('en')">EN</button>
      <button class="ltog" id="lt-de" onclick="setLang('de')">DE</button>
    </div>
  </div>
</header>

<main>
<div id="wizard">
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="pfill" style="width:0%"></div></div>
    <div class="prog-meta"><b id="pstep"></b><span id="ppct">0%</span></div>
  </div>

  <!-- STEP 1 -->
  <div class="step active" data-step="1">
    <div class="eyebrow"><div class="eline"></div><span data-i18n="s1_eyebrow"></span></div>
    <div class="sh" data-i18n="s1_title"></div>
    <div class="sp" data-i18n="s1_desc"></div>
    <div class="sc">
      <div><div class="sc-lbl" data-i18n="s1_lbl"></div><div class="sc-sub" data-i18n="s1_sub"></div></div>
      <div class="sc-ctrl">
        <button class="scb" onclick="stepV('admins',-1)">−</button>
        <div class="scn" id="d-admins">1</div>
        <button class="scb" onclick="stepV('admins',1)">+</button>
      </div>
    </div>
    <div class="ib blue">
      <svg viewBox="0 0 16 16" stroke="currentColor"><circle cx="8" cy="8" r="6"/><line x1="8" y1="6" x2="8" y2="9"/><line x1="8" y1="10.5" x2="8" y2="11"/></svg>
      <span data-i18n="s1_info"></span>
    </div>
    <div class="nav"><button class="btn-next" onclick="next()" data-i18n="btn_next"></button></div>
  </div>

  <!-- STEP 2 -->
  <div class="step" data-step="2">
    <div class="eyebrow"><div class="eline"></div><span data-i18n="s2_eyebrow"></span></div>
    <div class="sh" data-i18n="s2_title"></div>
    <div class="sp" data-i18n="s2_desc"></div>

    <!-- Agent info toggle -->
    <button class="info-toggle" id="agent-toggle" onclick="toggleAgent()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.5"/><line x1="7" y1="5.5" x2="7" y2="7"/><line x1="7" y1="9" x2="7" y2="9.5"/></svg>
      <span data-i18n="s2_show_agent"></span>
    </button>
    <div class="countries-box" id="agent-box" style="display:none;" data-i18n="s2_agent_detail"></div>

    <!-- PhoneBridge info toggle -->
    <button class="info-toggle" id="pb-toggle" onclick="togglePB()" style="margin-top:0;">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.5"/><line x1="7" y1="5.5" x2="7" y2="7"/><line x1="7" y1="9" x2="7" y2="9.5"/></svg>
      <span data-i18n="s2_show_pb"></span>
    </button>
    <div class="countries-box" id="pb-box" style="display:none;" data-i18n="s2_pb_detail"></div>

    <div class="sc">
      <div><div class="sc-lbl" data-i18n="s2_lbl"></div><div class="sc-sub" data-i18n="s2_sub"></div></div>
      <div class="sc-ctrl">
        <button class="scb" onclick="stepV('agents',-1)">−</button>
        <div class="scn" id="d-agents">0</div>
        <button class="scb" onclick="stepV('agents',1)">+</button>
      </div>
    </div>
    <div class="lic-preview">
      <div class="lp-title" data-i18n="lp_title"></div>
      <div class="lp-plans" id="lp-plans"></div>
    </div>
    <div class="ib blue">
      <svg viewBox="0 0 16 16" stroke="currentColor"><circle cx="8" cy="8" r="6"/><line x1="8" y1="6" x2="8" y2="9"/><line x1="8" y1="10.5" x2="8" y2="11"/></svg>
      <span data-i18n="s2_info"></span>
    </div>
    <div class="nav">
      <button class="btn-next" onclick="next()" data-i18n="btn_next"></button>
      <button class="btn-back" onclick="back()" data-i18n="btn_back"></button>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="step" data-step="3">
    <div class="eyebrow"><div class="eline"></div><span data-i18n="s3_eyebrow"></span></div>
    <div class="sh" data-i18n="s3_title"></div>
    <div class="sp" data-i18n="s3_desc"></div>
    <div class="slider-block">
      <div class="sl-top">
        <div class="sl-label" data-i18n="s3_slider_lbl"></div>
        <div class="sl-val" id="sv-out">0<span data-i18n="min_abbr"></span></div>
      </div>
      <input type="range" id="sl-out" min="0" max="300" step="5" value="0" oninput="slidePerUser('out',+this.value)">
      <div id="sl-out-calc" style="font-size:14px;color:var(--muted);margin-bottom:16px;font-family:'DM Mono',monospace;"></div>
      <div class="fbr-label" data-i18n="free_pkg_label"></div>
      <div class="fbr-rows" id="fbr-out"></div>
    </div>
    <div class="ib blue">
      <svg viewBox="0 0 16 16" stroke="currentColor"><circle cx="8" cy="8" r="6"/><line x1="8" y1="6" x2="8" y2="9"/><line x1="8" y1="10.5" x2="8" y2="11"/></svg>
      <span data-i18n="s3_info"></span>
    </div>
    <div class="nav">
      <button class="btn-next" onclick="next()" data-i18n="btn_next"></button>
      <button class="btn-back" onclick="back()" data-i18n="btn_back"></button>
    </div>
  </div>

  <!-- STEP 4 -->
  <div class="step" data-step="4">
    <div class="eyebrow"><div class="eline"></div><span data-i18n="s4_eyebrow"></span></div>
    <div class="sh" data-i18n="s4_title"></div>
    <div class="sp" data-i18n="s4_desc"></div>
    <div class="slider-block">
      <div class="sl-top">
        <div class="sl-label" data-i18n="s4_slider_lbl"></div>
        <div class="sl-val" id="sv-in">0<span data-i18n="min_abbr"></span></div>
      </div>
      <input type="range" id="sl-in" min="0" max="300" step="5" value="0" oninput="slidePerUser('in',+this.value)">
      <div id="sl-in-calc" style="font-size:14px;color:var(--muted);margin-bottom:16px;font-family:'DM Mono',monospace;"></div>
      <div class="fbr-label" data-i18n="free_pkg_label"></div>
      <div class="fbr-rows" id="fbr-in"></div>
    </div>
    <div class="ib blue">
      <svg viewBox="0 0 16 16" stroke="currentColor"><circle cx="8" cy="8" r="6"/><line x1="8" y1="6" x2="8" y2="9"/><line x1="8" y1="10.5" x2="8" y2="11"/></svg>
      <span data-i18n="s4_info"></span>
    </div>
    <div class="nav">
      <button class="btn-next" onclick="next()" data-i18n="btn_next"></button>
      <button class="btn-back" onclick="back()" data-i18n="btn_back"></button>
    </div>
  </div>

  <!-- STEP 5 -->
  <div class="step" data-step="5">
    <div class="eyebrow"><div class="eline"></div><span data-i18n="s5_eyebrow"></span></div>
    <div class="sh" data-i18n="s5_title"></div>
    <div class="sp" data-i18n="s5_desc"></div>

    <!-- Info toggle: which countries are in the bundle -->
    <button class="info-toggle" id="countries-toggle" onclick="toggleCountries()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.5"/><line x1="7" y1="5.5" x2="7" y2="7"/><line x1="7" y1="9" x2="7" y2="9.5"/></svg>
      <span data-i18n="s5_show_countries"></span>
    </button>
    <div class="countries-box" id="countries-box" style="display:none;" data-i18n="s5_countries_detail"></div>

    <div class="opts">
      <div class="opt" onclick="pick('intl','none',this);hideIntlWarn()">
        <div class="opt-icon"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><line x1="10" y1="3" x2="10" y2="17"/><path d="M3.5 7.5Q7 9 10 10q3-1 6.5-2.5"/><path d="M3.5 12.5Q7 11 10 10q3 1 6.5 2.5"/></svg></div>
        <div class="opt-lbl" data-i18n="s5_opt1_lbl"></div>
        <div class="opt-sub" data-i18n="s5_opt1_sub"></div>
      </div>
      <div class="opt" onclick="pick('intl','world',this);showIntlWarn()">
        <div class="opt-icon"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><line x1="10" y1="3" x2="10" y2="17"/><path d="M3.5 7.5Q7 9 10 10q3-1 6.5-2.5"/><path d="M3.5 12.5Q7 11 10 10q3 1 6.5 2.5"/><line x1="15" y1="4" x2="17" y2="6"/><line x1="17" y1="4" x2="15" y2="6"/></svg></div>
        <div class="opt-lbl" data-i18n="s5_opt2_lbl"></div>
        <div class="opt-sub" data-i18n="s5_opt2_sub"></div>
      </div>
    </div>

    <!-- International warning — shown only when 'world' is selected -->
    <div class="ib yellow" id="intl-warn" style="display:none;margin-top:4px;">
      <svg viewBox="0 0 16 16" stroke="currentColor"><path d="M8 2L14 13H2L8 2z"/><line x1="8" y1="7" x2="8" y2="10"/><line x1="8" y1="11.5" x2="8" y2="12"/></svg>
      <span id="intl-warn-text"></span>
    </div>

    <div class="nav">
      <button class="btn-next" onclick="next()" data-i18n="btn_next"></button>
      <button class="btn-back" onclick="back()" data-i18n="btn_back"></button>
    </div>
  </div>

  <!-- STEP 6 -->
  <div class="step" data-step="6">
    <div class="eyebrow"><div class="eline"></div><span data-i18n="s6_eyebrow"></span></div>
    <div class="sh" data-i18n="s6_title"></div>
    <div class="sp" data-i18n="s6_desc"></div>
    <div class="checks">
      <div class="chk on" id="chk-ivr" onclick="togChk(this,'ivr')">
        <div class="chk-box"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <div class="chk-body"><strong data-i18n="f_ivr_title"></strong><span data-i18n="f_ivr_desc"></span></div>
      </div>
      <div class="chk" id="chk-mon" onclick="togChk(this,'monitoring')">
        <div class="chk-box"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <div class="chk-body"><strong data-i18n="f_mon_title"></strong><span data-i18n="f_mon_desc"></span></div>
      </div>
      <div class="chk" id="chk-dia" onclick="togChk(this,'dialer')">
        <div class="chk-box"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <div class="chk-body"><strong data-i18n="f_dia_title"></strong><span data-i18n="f_dia_desc"></span></div>
      </div>
      <div class="chk" id="chk-que" onclick="togChk(this,'queue')">
        <div class="chk-box"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <div class="chk-body"><strong data-i18n="f_que_title"></strong><span data-i18n="f_que_desc"></span></div>
      </div>
      <div class="chk" id="chk-sms" onclick="togChk(this,'sms')">
        <div class="chk-box"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
        <div class="chk-body"><strong data-i18n="f_sms_title"></strong><span data-i18n="f_sms_desc"></span></div>
      </div>
    </div>
    <div class="nav">
      <button class="btn-next" onclick="next()" data-i18n="btn_next"></button>
      <button class="btn-back" onclick="back()" data-i18n="btn_back"></button>
    </div>
  </div>

  <!-- STEP 7 -->
  <div class="step" data-step="7">
    <div class="eyebrow"><div class="eline"></div><span data-i18n="s7_eyebrow"></span></div>
    <div class="sh" data-i18n="s7_title"></div>
    <div class="sp" data-i18n="s7_desc"></div>
    <div class="num-grid">
      <div class="num-card">
        <div class="nc-icon"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="8" y1="5" x2="8" y2="11"/></svg></div>
        <label data-i18n="n_local_lbl"></label>
        <span class="nsub" data-i18n="n_local_sub"></span>
        <div class="nstep"><button onclick="stepN('local',-1)">−</button><input type="number" id="n-local" value="1" min="0"><button onclick="stepN('local',1)">+</button></div>
      </div>
      <div class="num-card">
        <div class="nc-icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><line x1="5" y1="8" x2="11" y2="8"/></svg></div>
        <label data-i18n="n_tf_lbl"></label>
        <span class="nsub" data-i18n="n_tf_sub"></span>
        <div class="nstep"><button onclick="stepN('tollfree',-1)">−</button><input type="number" id="n-tollfree" value="0" min="0"><button onclick="stepN('tollfree',1)">+</button></div>
      </div>
      <div class="num-card">
        <div class="nc-icon"><svg viewBox="0 0 16 16"><circle cx="8" cy="6" r="3"/><path d="M2 14c0-3 2.5-5 6-5s6 2 6 5"/></svg></div>
        <label data-i18n="n_pers_lbl"></label>
        <span class="nsub" data-i18n="n_pers_sub"></span>
        <div class="nstep"><button onclick="stepN('personal',-1)">−</button><input type="number" id="n-personal" value="0" min="0"><button onclick="stepN('personal',1)">+</button></div>
      </div>
    </div>
    <div class="nav">
      <button class="btn-next" onclick="next()" data-i18n="btn_next"></button>
      <button class="btn-back" onclick="back()" data-i18n="btn_back"></button>
    </div>
  </div>

  <!-- STEP 8 -->
  <div class="step" data-step="8">
    <div class="eyebrow"><div class="eline"></div><span data-i18n="s8_eyebrow"></span></div>
    <div class="sh" data-i18n="s8_title"></div>
    <div class="sp" data-i18n="s8_desc"></div>
    <div class="btoggle">
      <button class="btog on" id="t-ann" onclick="setBill('annual')" data-i18n="bill_annual"></button>
      <button class="btog" id="t-mon" onclick="setBill('monthly')" data-i18n="bill_monthly"></button>
    </div>
    <div class="ib green" id="bill-note">
      <svg viewBox="0 0 16 16" stroke="currentColor"><path d="M13 3L6 11 3 8"/></svg>
      <span data-i18n="bill_annual_note"></span>
    </div>
    <div class="nav">
      <button class="btn-next grn" onclick="showResult()" data-i18n="btn_result"></button>
      <button class="btn-back" onclick="back()" data-i18n="btn_back"></button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result">
  <div class="r-hero">
    <h2 data-i18n="r_hero_title"></h2>
    <p id="r-sum"></p>
  </div>
  <div class="rec">
    <div class="rec-badge"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg><span data-i18n="r_rec_badge"></span></div>
    <div class="rec-name" id="r-name"></div>
    <div class="rec-why" id="r-why"></div>
    <div class="rec-price-row">
      <div class="rec-price" id="r-price"></div>
      <div class="rec-psub" id="r-psub"></div>
    </div>
    <div class="rec-total" id="r-total"></div>
    <div class="rec-rows" id="r-rows"></div>
  </div>
  <div class="lic-block">
    <div class="lb-title"><svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="2"/><line x1="4" y1="7" x2="10" y2="7"/><line x1="7" y1="4" x2="7" y2="10"/></svg><span data-i18n="lb_title"></span></div>
    <div class="lb-grid" id="lb-grid"></div>
    <div class="slots-label" data-i18n="slots_label"></div>
    <div class="slots-row" id="slot-admins"></div>
    <div class="slots-row" id="slot-agents"></div>
    <div class="slot-legend" id="slot-legend"></div>
  </div>
  <div class="min-block">
    <div class="mb-title"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5"/><polyline points="7,4 7,7 9,9"/></svg><span data-i18n="mb_title"></span></div>
    <div class="mb-grid" id="mb-grid"></div>
  </div>
  <div class="cmp-label" data-i18n="cmp_label"></div>
  <div class="plan-grid" id="plan-grid"></div>
  <div class="cta">
    <h3 data-i18n="cta_title"></h3>
    <p data-i18n="cta_desc"></p>

    <!-- Zoho Form -->
    <iframe name="zf_iframe" style="display:none;"></iframe>
    <form action='https://forms.zohopublic.eu/wolq/form/ContactUs/formperma/pApUqqNcXXFwAa2SuDa5fkgFoYrgT2wkorLzuM3yO3g/htmlRecords/submit'
          name='zf_form' id='zf_form' method='POST' accept-charset='UTF-8' enctype='multipart/form-data'
          target="zf_iframe" onsubmit="setTimeout(zfShowSuccess,800)">
      <input type="hidden" name="zf_referrer_name" value="">
      <input type="hidden" name="zf_redirect_url" value="">
      <input type="hidden" name="zc_gad" value="">
      <!-- Calculator samenvatting — automatisch gevuld -->
      <input type="hidden" name="MultiLine" id="zf_summary">

      <div class="zf-form">
        <div class="zf-row">
          <div>
            <label data-i18n="form_firstname"></label>
            <input type="text" name="Name_First" maxlength="255" required data-i18n-ph="form_firstname_ph">
          </div>
          <div>
            <label data-i18n="form_lastname"></label>
            <input type="text" name="Name_Last" maxlength="255" required data-i18n-ph="form_lastname_ph">
          </div>
        </div>
        <div>
          <label data-i18n="form_email"></label>
          <input type="text" name="Email" maxlength="255" required data-i18n-ph="form_email_ph">
        </div>
        <button type="submit" class="zf-submit" id="zf_submit" data-i18n="form_submit"></button>
      </div>
    </form>

    <div class="zf-success" id="zf_success">
      <strong data-i18n="form_success_title"></strong>
      <span data-i18n="form_success_desc"></span>
    </div>

    <div class="zf-divider" style="margin-top:20px;"><span data-i18n="form_or"></span></div>
    <div style="text-align:center;margin-top:12px;">
      <a href="https://www.zoho.com/voice/pricing.html" target="_blank" class="btnc sec" data-i18n="cta_btn2"></a>
    </div>

let lang = 'en';

function t(key, vars){
  let s = (TX[lang][key] || TX.nl[key] || key);
  if(vars) Object.keys(vars).forEach(k=>{ s=s.replaceAll('{'+k+'}',vars[k]); });
  return s;
}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    const v=TX[lang][k];
    if(v!==undefined) el.innerHTML=v;
  });
  updProg();
  renderLicPreview();
  renderBars('out',S.outMin,Math.max(S.outMin*1.5,1000));
  renderBars('in',S.inMin,Math.max(S.inMin*1.5,1000));
  setBill(S.billing,true);
  // Refresh intl warning if visible
  if(S.intl==='world') showIntlWarn();
  // Reset countries toggle label
  const ctBtn=document.getElementById('countries-toggle');
  const ctBox=document.getElementById('countries-box');
  if(ctBtn&&ctBox) ctBtn.querySelector('span').textContent=ctBox.style.display==='none'?t('s5_show_countries'):t('s5_hide_countries');
  const agBtn=document.getElementById('agent-toggle');
  const agBox=document.getElementById('agent-box');
  if(agBtn&&agBox) agBtn.querySelector('span').textContent=agBox.style.display==='none'?t('s2_show_agent'):t('s2_hide_agent');
  const pbBtn=document.getElementById('pb-toggle');
  const pbBox=document.getElementById('pb-box');

const S={admins:1,agents:0,outPerUser:0,inPerUser:0,outMin:0,inMin:0,intl:null,
  features:{ivr:true,monitoring:false,dialer:false,queue:false,sms:false},
  nums:{local:1,tollfree:0,personal:0},billing:'annual'};
const TOTAL=8; let cur=1;

const PL={
  basic:   {n:'Basic',          pa:34,pm:39,fO:250, fI:1000,fNC:0,hasAgents:false},
  standard:{n:'Standard',       pa:49,pm:59,fO:250, fI:1000,fNC:0,hasAgents:true},
  cc:      {n:'Contact Center', pa:74,pm:79,fO:500, fI:2500,fNC:1,hasAgents:true}
};
const R_OUT=0.025,R_IN=0.0085;

function numLics(k){ return k==='basic'?S.admins:Math.max(S.admins,Math.ceil((S.agents||0)/10)); }
function licDriver(k){
  if(k==='basic') return 'admins';
  const byA=S.admins, byG=Math.ceil((S.agents||0)/10);
  return byG>byA?'agents':byA>byG?'admins':'equal';
}
function pl(k){ const plan=PL[k]; return plan; }
function ppu(k){ return S.billing==='annual'?PL[k].pa:PL[k].pm; }
function fmt(n){ return Math.round(n).toLocaleString(lang==='nl'?'nl-NL':'en-US'); }
function plur(n,one,more){ return n===1?one:more; }

// ══════════════════════════════════════════
// PROGRESS
// ══════════════════════════════════════════
function updProg(){
  const p=Math.round(((cur-1)/TOTAL)*100);
  document.getElementById('pfill').style.width=p+'%';
  document.getElementById('pstep').textContent=t('step_of',{cur,total:TOTAL});
  document.getElementById('ppct').textContent=p+'%';
}

// ══════════════════════════════════════════
// NAV
// ══════════════════════════════════════════
function next(){
  if(cur===5&&!S.intl){alert(t('alert_intl'));return;}
  if(cur>=TOTAL){showResult();return;}
  goTo(cur+1);
}
function back(){ if(cur>1)goTo(cur-1); }
function goTo(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  const t2=document.querySelector(`.step[data-step="${n}"]`);
  if(t2){t2.classList.add('active');cur=n;}
  updProg();
  window.scrollTo({top:0,behavior:'smooth'});
  if(n===2)renderLicPreview();
  if(n===3){renderBars('out',S.outMin,Math.max(S.outMin*1.5,1000));if(S.outPerUser>0)slidePerUser('out',S.outPerUser);}
  if(n===4){renderBars('in',S.inMin,Math.max(S.inMin*1.5,1000));if(S.inPerUser>0)slidePerUser('in',S.inPerUser);}
}

function stepV(k,d){ S[k]=Math.max(k==='agents'?0:1,S[k]+d); document.getElementById('d-'+k).textContent=S[k]; renderLicPreview(); }
const WORK_DAYS = 22; // werkdagen per maand

function usersCount(){ return Math.max(1, S.admins + S.agents); }

function slidePerUser(dir,v){
  const users = usersCount();
  const totalMin = Math.round(v * users * WORK_DAYS);
  if(dir==='out'){
    S.outPerUser = v;
    S.outMin = totalMin;
    const h = Math.floor(v/60), m = v%60;
    const hStr = h>0 ? h+(lang==='nl'?'u ':lang==='de'?'Std ':'h '): '';
    const mStr = m>0 ? m+' '+(lang==='nl'?'min':'min'): '';
    const valStr = v===0 ? (lang==='nl'?'0 min/dag':lang==='de'?'0 Min/Tag':'0 min/day') : (hStr+mStr).trim()+(lang==='nl'?'/dag':lang==='de'?'/Tag':'/day');
    document.getElementById('sv-out').innerHTML = valStr;
    const calcEl = document.getElementById('sl-out-calc');
    if(calcEl){
      if(v===0){
        calcEl.textContent = lang==='nl'?'Geen uitgaande minuten ingesteld':lang==='de'?'Keine Ausgangsminuten eingestellt':'No outbound minutes set';
      } else {
        calcEl.textContent = users+' '+(lang==='nl'?'gebruiker'+(users!==1?'s':''):lang==='de'?'Nutzer':'user'+(users!==1?'s':''))+' × '+v+' min/dag × '+WORK_DAYS+(lang==='nl'?' werkdagen':lang==='de'?' Arbeitstage':' working days')+' = '+fmt(totalMin)+' min/'+(lang==='nl'?'mnd':lang==='de'?'Monat':'mo');
      }
    }
  } else {
    S.inPerUser = v;
    S.inMin = totalMin;
    const h = Math.floor(v/60), m = v%60;
    const hStr = h>0 ? h+(lang==='nl'?'u ':lang==='de'?'Std ':'h '): '';
    const mStr = m>0 ? m+' '+(lang==='nl'?'min':'min'): '';
    const valStr = v===0 ? (lang==='nl'?'0 min/dag':lang==='de'?'0 Min/Tag':'0 min/day') : (hStr+mStr).trim()+(lang==='nl'?'/dag':lang==='de'?'/Tag':'/day');
    document.getElementById('sv-in').innerHTML = valStr;
    const calcEl = document.getElementById('sl-in-calc');
    if(calcEl){
      if(v===0){
        calcEl.textContent = lang==='nl'?'Geen inkomende minuten ingesteld':lang==='de'?'Keine Eingangsminuten eingestellt':'No inbound minutes set';
      } else {
        calcEl.textContent = users+' '+(lang==='nl'?'gebruiker'+(users!==1?'s':''):lang==='de'?'Nutzer':'user'+(users!==1?'s':''))+' × '+v+' min/dag × '+WORK_DAYS+(lang==='nl'?' werkdagen':lang==='de'?' Arbeitstage':' working days')+' = '+fmt(totalMin)+' min/'+(lang==='nl'?'mnd':lang==='de'?'Monat':'mo');
      }
    }
  }
  renderBars(dir, totalMin, dir==='out'?999999:999999);
}

function renderLicPreview(){
  const el=document.getElementById('lp-plans'); if(!el)return;
  ['basic','standard','cc'].forEach((k,i)=>{
    const l=numLics(k), driver=licDriver(k);

      ${p2.hasAgents?`
        <div class="lp-row"><span>${t('lp_slots')}</span><b>${slots}</b></div>
        <div class="lp-row ${waste>0?'waste':''}"><span>${t('lp_unused')}</span><b>${waste}</b></div>
        ${bonus>0?`<div class="lp-row bonus"><span>${t('lp_bonus')}</span><b>+${bonus}</b></div>`:''}
        ${driver==='agents'?`<div class="lp-row driver"><span>${t('lp_driver')}</span><b>${t('driving_agents')}</b></div>`:''}

// ══════════════════════════════════════════
// BARS
// ══════════════════════════════════════════
function renderBars(dir,val,max){
  const el=document.getElementById('fbr-'+dir); if(!el)return;
  const rate=dir==='out'?R_OUT:R_IN;
  el.innerHTML=['basic','standard','cc'].map(k=>{
    const l=numLics(k), free=(dir==='out'?PL[k].fO:PL[k].fI)*l;
    const over=Math.max(0,val-free);
    const freePct=max>0?Math.min(100,(free/max)*100):0;
    const usedPct=max>0?Math.min(freePct,(val/max)*100):0;
    const overPct=max>0&&over>0?Math.min(100-usedPct,(over/max)*100):0;
    const infoTxt=over>0?t('bar_over',{n:fmt(over),c:(over*rate).toFixed(2)}):t('bar_free',{n:fmt(free)});
    return `<div class="fbr-row">
      <div class="fbr-name">${PL[k].n} (${l}×)</div>
      <div class="fbr-track">
        <div class="fbr-free" style="width:${usedPct}%"></div>
        ${over>0?`<div class="fbr-over" style="left:${usedPct}%;width:${overPct}%"></div>`:''}
      </div>
      <div class="fbr-info ${over>0?'ov':'ok'}">${infoTxt}</div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════
// CALC
// ══════════════════════════════════════════
function calc(k){
  const plan=PL[k], p=ppu(k), l=numLics(k), driver=licDriver(k);
  const slots=plan.hasAgents?l*10:0, used=plan.hasAgents?Math.min(S.agents,slots):0;
  const waste=slots-used, bonus=plan.hasAgents&&driver==='agents'?l-S.admins:0;
  const planCost=p*l;
  let agentExtra=k==='basic'&&S.agents>0?S.agents*p:0;
  let addon=0;
  if(k!=='cc'){ if(S.features.monitoring)addon+=10*S.admins; if(S.features.dialer)addon+=10*S.admins; if(S.features.queue)addon+=10*S.admins; }
  const freeLocal=k==='cc'?l:0;
  const numCost=Math.max(0,S.nums.local-freeLocal)*1+S.nums.tollfree*2+S.nums.personal*3;
  const fO=plan.fO*l, fI=plan.fI*l;
  const ovO=Math.max(0,S.outMin-fO), ovI=Math.max(0,S.inMin-fI);
  const callC=ovO*R_OUT+ovI*R_IN;
  const sub=planCost+agentExtra+addon+numCost;
  return{k,plan,l,p,driver,slots,used,waste,bonus,planCost,agentExtra,addon,numCost,fO,fI,ovO,ovI,callC,freeLocal,sub,total:sub+callC};
}

// ══════════════════════════════════════════
// RECOMMEND
// ══════════════════════════════════════════
function recommend(){
  const needCC=S.features.monitoring||S.features.dialer||S.features.queue;
  if(needCC){
    const ff=[];
    if(S.features.monitoring)ff.push(lang==='nl'?'Call Monitoring':'Call Monitoring');
    if(S.features.dialer)ff.push('Power Dialer');
    if(S.features.queue)ff.push(lang==='nl'?'Wachtrijstatistieken':'Queue Metrics');
    return{w:'cc',reason:t('rec_why_cc',{feats:ff.join(', ')})};
  }
  if(S.agents>0){
    const l=numLics('standard'), driver=licDriver('standard');
    const bonus=driver==='agents'?l-S.admins:0;
    const bonusTxt=bonus>0?t('rec_why_std_bonus',{n:bonus,s:bonus>1?'s':''}):'';
    return{w:'standard',reason:t('rec_why_std',{agents:S.agents,gs:S.agents>1?'s':'',lics:l,slots:l*10,bonus:bonusTxt})};
  }
  const cb=calc('basic'),cs=calc('standard');
  if(cs.total-cb.total<15) return{w:'standard',reason:t('rec_why_std_margin')};
  return{w:'basic',reason:t('rec_why_basic',{admins:S.admins,as:S.admins>1?'s':''})};
}

      <div class="mb-row"><span>${t('mb_total')}</span><span class="mv">${fmt(S.outMin)} ${t('min_abbr')}</span></div>
      <div class="mb-row free"><span>${t('mb_free_pkg')} (${mbR.l}× ${PL[w].fO})</span><span class="mv">${fmt(mbR.fO)} ${t('min_abbr')}</span></div>
      ${mbR.ovO>0?`<div class="mb-row over"><span>${t('mb_overrun')}</span><span class="mv">${fmt(mbR.ovO)} ${t('min_abbr')}</span></div><div class="mb-row cost"><span>${t('mb_cost')} (× $${R_OUT})</span><span class="mv">~$${(mbR.ovO*R_OUT).toFixed(2)}/mnd</span></div>`:`<div class="mb-row free"><span>${t('mb_overrun')}</span><span class="mv">${t('mb_none')}</span></div>`}
    </div>
    <div>
      <div class="mb-col-title">${t('mb_in')}</div>
      <div class="mb-row"><span>${t('mb_total')}</span><span class="mv">${fmt(S.inMin)} ${t('min_abbr')}</span></div>
      <div class="mb-row free"><span>${t('mb_free_pkg')} (${mbR.l}× ${PL[w].fI})</span><span class="mv">${fmt(mbR.fI)} ${t('min_abbr')}</span></div>
      ${mbR.ovI>0?`<div class="mb-row over"><span>${t('mb_overrun')}</span><span class="mv">${fmt(mbR.ovI)} ${t('min_abbr')}</span></div><div class="mb-row cost"><span>${t('mb_cost')} (× $${R_IN})</span><span class="mv">~$${(mbR.ovI*R_IN).toFixed(2)}/mnd</span></div>`:`<div class="mb-row free"><span>${t('mb_overrun')}</span><span class="mv">${t('mb_none')}</span></div>`}
    </div>`;

  // PLAN GRID
  document.getElementById('plan-grid').innerHTML=['basic','standard','cc'].map(k=>{
    const r=R[k], win=k===w;
    const callClr=r.callC>0?'var(--yellow)':'var(--green)';
    const callTxt=r.callC>0?t('pc_call_over',{n:fmt(r.callC)}):t('pc_call_free');
    const licsSub=t('pc_lics_sub',{l:r.l,s:r.l>1?'s':'',slots:r.slots});
    const feats=getFeats(k,r);
    return`<div class="pc ${win?'win':''}">
      ${win?`<div class="pc-badge">${t('plan_rec_badge')}</div>`:''}
      <div class="pc-name">${r.plan.n}</div>
      <div class="pc-lics">${licsSub}</div>
      <div class="pc-price">€${fmt(r.sub)}<span style="font-size:12px;color:var(--muted);font-family:'Wix Madefor Display',sans-serif"> /${lang==='nl'?'mnd':'mo'}</span></div>
      <div class="pc-sub">${t(S.billing==='annual'?'bill_annual':'bill_monthly').toLowerCase()}</div>
      <div class="pc-call" style="color:${callClr}">${callTxt}</div>
      <div class="pc-feats">${feats.map(f=>`<div class="pf ${f.c}"><svg viewBox="0 0 12 12">${icn(f.c)}</svg>${f.t}</div>`).join('')}</div>
    </div>`;
  }).join('');

  window.scrollTo({top:0,behavior:'smooth'});
  prefillForm(rec, w);
}

function icn(c){ return c==='yes'?'<polyline points="2,6 5,9 10,3"/>':c==='no'?'<line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/>':'<line x1="6" y1="2" x2="6" y2="10"/><line x1="2" y1="6" x2="10" y2="6"/>'; }

function getFeats(k,r){
  const f=[];
  f.push({c:'yes',t:t('pf_free_out',{n:fmt(r.fO)})});
  f.push({c:'yes',t:t('pf_free_in',{n:fmt(r.fI)})});
  if(r.ovO>0)f.push({c:'no',t:t('pf_over_out',{n:fmt(r.ovO)})});
  if(r.ovI>0)f.push({c:'no',t:t('pf_over_in',{n:fmt(r.ovI)})});
  if(k==='basic')f.push({c:S.agents>0?'no':'yes',t:t('pf_no_agents')});
  else{
    f.push({c:'yes',t:t('pf_slots',{n:r.slots,l:r.l})});
    if(r.bonus>0)f.push({c:'yes',t:t('pf_bonus_adm',{n:r.bonus,s:r.bonus>1?'s':''})});
    if(r.waste>0)f.push({c:'no',t:t('pf_unused',{n:r.waste,s:r.waste>1?'s':''})});
  }
  if(S.features.monitoring)f.push({c:k==='cc'?'yes':'add',t:t(k==='cc'?'pf_mon_incl':'pf_mon_add')});
  if(S.features.dialer)    f.push({c:k==='cc'?'yes':'add',t:t(k==='cc'?'pf_dia_incl':'pf_dia_add')});
  if(S.features.queue)     f.push({c:k==='cc'?'yes':'add',t:t(k==='cc'?'pf_que_incl':'pf_que_add')});
  if(k==='cc'&&r.freeLocal>0)f.push({c:'yes',t:t('pf_free_num',{n:r.freeLocal,s:r.freeLocal>1?'s':''})});
  return f;
}

// ══════════════════════════════════════════
// ZOHO FORM
// ══════════════════════════════════════════
function buildSummary(rec, w){
  const lines = [
    `Recommended plan : ${rec.plan.n}`,
    `Licenses         : ${rec.l}×`,
    `Admins           : ${S.admins}`,
    `Agents           : ${S.agents}`,
    `Outbound minutes : ${fmt(S.outMin)}/mo`,
    `Inbound minutes  : ${fmt(S.inMin)}/mo`,
    `Billing          : ${S.billing === 'annual' ? 'Annual' : 'Monthly'}`,
    `Estimated cost   : €${fmt(rec.sub)}/mo`,
    `Features         : ${Object.entries(S.features).filter(([,v])=>v).map(([k])=>k).join(', ')}`,
    `International    : ${S.intl === 'world' ? 'Outside bundle' : 'Bundle countries only'}`,
    `Numbers          : local ${S.nums.local}, toll-free ${S.nums.tollfree}, personal ${S.nums.personal}`,
    `Call overage     : ${rec.callC > 0 ? '~€'+fmt(rec.callC)+'/mo' : 'none — within free package'}`,
  ];
  return lines.join('\n');
}

function prefillForm(rec, w){
  const el = document.getElementById('zf_summary');
  if(el) el.value = buildSummary(rec, w);
  // Also apply i18n placeholders
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const k = el.getAttribute('data-i18n-ph');
    const v = TX[lang][k];
    if(v) el.placeholder = v;
  });
}

function zfShowSuccess(){
  document.getElementById('zf_form').style.display = 'none';
  const success = document.getElementById('zf_success');
  success.style.display = 'block';
  success.querySelector('[data-i18n="form_success_title"]').textContent = t('form_success_title');
  success.querySelector('[data-i18n="form_success_desc"]').textContent = t('form_success_desc');
}

// ══════════════════════════════════════════
// RESTART
// ══════════════════════════════════════════
function restart(){
  Object.assign(S,{admins:1,agents:0,outPerUser:0,inPerUser:0,outMin:0,inMin:0,intl:null,
    features:{ivr:true,monitoring:false,dialer:false,queue:false,sms:false},
    nums:{local:1,tollfree:0,personal:0},billing:'annual'});
  ['admins','agents'].forEach(k=>document.getElementById('d-'+k).textContent=k==='admins'?1:0);
  ['out','in'].forEach(d=>{
    document.getElementById('sl-'+d).value=0;
    document.getElementById('sv-'+d).innerHTML='0 min/dag';
    const calcEl=document.getElementById('sl-'+d+'-calc'); if(calcEl) calcEl.textContent='';
  });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  document.querySelectorAll('.chk').forEach(c=>{c.classList.remove('on');if(c.id==='chk-ivr')c.classList.add('on');});
  document.getElementById('n-local').value=1;
  document.getElementById('n-tollfree').value=0;
  document.getElementById('n-personal').value=0;
  document.getElementById('t-ann').classList.add('on');
  document.getElementById('t-mon').classList.remove('on');
  document.getElementById('result').style.display='none';
  document.getElementById('result').classList.remove('show');
  document.getElementById('wizard').style.display='block';
  cur=1; goTo(1);
}

const lpEl=document.getElementById('lp-plans');
['basic','standard','cc'].forEach(()=>{ const d=document.createElement('div'); lpEl.appendChild(d); });
setLang('nl');
</script>
